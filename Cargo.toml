[package]
name = "ruschip"
version = "0.1.0"
authors = ["Segmentation Violator <segmentationviolator@proton.me>"]
edition = "2021"
description = "a multi-variant CHIP-8 emulator"
license = "GPL-3.0-or-later"

[dependencies]
bitvec = { version = "1.1.1" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
rand = "0.10.2"
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["wayland"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
