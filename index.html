<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#815BA4" />

        <link data-trunk rel="icon" href="assets/icon.png" />
        <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int" />

        <style>
            html,
            body,
            #ruschip-canvas {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #1C1C1C;
            }

            #ruschip-canvas {
                display: block;
                outline: none;
            }
        </style>

        <title>Ruschip</title>
    </head>
    <body>
        <canvas id="ruschip-canvas" tabindex="0">Ruschip requires a browser with canvas support.</canvas>
    </body>
</html>
